<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pixel Battle · Liquid Glass</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1a1f2e, #0b0d14);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, 'Segoe UI', system-ui, Roboto, sans-serif;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }

    .glass-container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 0 30px rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
      padding: 12px;
    }

    h1 {
      font-weight: 500;
      font-size: clamp(1.8rem, 5vw, 2.2rem);
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      background: linear-gradient(to bottom, #ffffff, #d0d8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.3);
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
      flex-shrink: 0;
    }

    .subtitle {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 8px;
      font-weight: 400;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }

    .canvas-wrapper {
      flex: 1;
      width: 100%;
      background: rgba(20, 22, 30, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: inset 0 0 25px rgba(0,0,0,0.5), 0 15px 30px rgba(0,0,0,0.6);
      margin-bottom: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      touch-action: none;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: white;
      box-shadow: 0 0 15px rgba(255,255,255,0.2);
      transform-origin: center center;
      will-change: transform;
      max-width: 100%;
      max-height: 100%;
    }

    .toolbar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 40px;
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 8px;
      gap: 10px;
      flex-shrink: 0;
    }

    .color-indicator {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #FF3B30;
      box-shadow: 0 0 20px rgba(255, 59, 48, 0.7), inset 0 1px 4px rgba(255,255,255,0.5);
      border: 2px solid rgba(255,255,255,0.4);
      backdrop-filter: blur(10px);
      transition: background 0.2s;
    }

    .color-picker-hidden {
      opacity: 0;
      position: absolute;
      width: 40px;
      height: 40px;
      left: 0;
      top: 0;
      cursor: pointer;
      z-index: 2;
    }

    .color-pick-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .coords {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(15px);
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 500;
      color: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.2);
      letter-spacing: 0.3px;
      font-family: monospace;
    }

    .btn {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 30px;
      padding: 10px 16px;
      font-weight: 500;
      color: white;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3), inset 0 1px 2px rgba(255,255,255,0.4);
      cursor: pointer;
    }

    .btn:active {
      transform: scale(0.95);
      background: rgba(255,255,255,0.25);
      border-color: rgba(255,255,255,0.5);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(15px);
      border-radius: 30px;
      padding: 6px 14px;
      font-size: 0.8rem;
      border: 1px solid rgba(255,255,255,0.2);
      color: #b4e0ff;
    }

    .online-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #30d158;
      box-shadow: 0 0 12px #30d158;
    }

    .zoom-controls {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      margin-bottom: 6px;
    }

    .zoom-btn {
      padding: 8px 14px;
      font-size: 1.1rem;
    }

    .hint-text {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.4);
      flex-shrink: 0;
    }

    @media (max-width: 400px) {
      .glass-container {
        padding: 8px;
      }
      .toolbar {
        padding: 6px 10px;
        gap: 6px;
      }
    }
  </style>
</head>
<body>
  <div class="glass-container">
    <h1>Pixel Battle</h1>
    <div class="subtitle">холст 2048×2048 · рисуй вместе</div>

    <div class="canvas-wrapper" id="canvasWrapper">
      <canvas id="pixelCanvas" width="2048" height="2048"></canvas>
    </div>

    <div class="toolbar">
      <div class="color-pick-wrapper">
        <div class="color-indicator" id="colorPreview"></div>
        <input type="color" id="colorPicker" class="color-picker-hidden" value="#FF3B30">
      </div>
      <div class="coords" id="coordDisplay">X: - Y: -</div>
      <div class="status-badge">
        <span class="online-dot"></span>
        <span id="playerCount">1</span>
      </div>
    </div>

    <div class="zoom-controls">
      <button class="btn zoom-btn" id="zoomIn">🔍+</button>
      <button class="btn zoom-btn" id="zoomOut">🔍-</button>
      <button class="btn zoom-btn" id="zoomReset">↺</button>
    </div>

    <div class="hint-text">касайся холста для рисования · масштабируй жестами</div>
  </div>

  <script>
    // ===== Pixel Battle - Все в одном файле =====
    (function() {
      // Конфигурация
      const CANVAS_SIZE = 2048;
      const STORAGE_KEY = 'pixel_battle_canvas_2048';
      
      // DOM элементы
      const canvas = document.getElementById('pixelCanvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true, alpha: false });
      const colorPicker = document.getElementById('colorPicker');
      const colorPreview = document.getElementById('colorPreview');
      const coordDisplay = document.getElementById('coordDisplay');
      const playerCountSpan = document.getElementById('playerCount');
      const canvasWrapper = document.getElementById('canvasWrapper');
      const zoomInBtn = document.getElementById('zoomIn');
      const zoomOutBtn = document.getElementById('zoomOut');
      const zoomResetBtn = document.getElementById('zoomReset');

      // Состояние
      let currentColor = '#FF3B30';
      let imageData;
      let isDrawing = false;
      let currentZoom = 1;
      let zoomTarget = 1;
      let lastTouchDistance = 0;
      const tabId = Date.now().toString(36) + Math.random().toString(36).substr(2, 6);

      // ===== ИНИЦИАЛИЗАЦИЯ ХОЛСТА =====
      function initCanvas() {
        imageData = ctx.createImageData(CANVAS_SIZE, CANVAS_SIZE);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          data[i] = 255;     // R
          data[i + 1] = 255; // G
          data[i + 2] = 255; // B
          data[i + 3] = 255; // A
        }
        ctx.putImageData(imageData, 0, 0);
      }

      // ===== РАБОТА С ПИКСЕЛЯМИ =====
      function setPixel(x, y, colorHex) {
        if (x < 0 || x >= CANVAS_SIZE || y < 0 || y >= CANVAS_SIZE) return false;
        
        const r = parseInt(colorHex.slice(1, 3), 16);
        const g = parseInt(colorHex.slice(3, 5), 16);
        const b = parseInt(colorHex.slice(5, 7), 16);
        
        const index = (y * CANVAS_SIZE + x) * 4;
        imageData.data[index] = r;
        imageData.data[index + 1] = g;
        imageData.data[index + 2] = b;
        imageData.data[index + 3] = 255;
        
        ctx.putImageData(imageData, 0, 0);
        return true;
      }

      // ===== СОХРАНЕНИЕ И ЗАГРУЗКА =====
      function saveCanvasToStorage() {
        try {
          const dataUrl = canvas.toDataURL('image/png');
          localStorage.setItem(STORAGE_KEY, dataUrl);
          
          // Отправляем через BroadcastChannel если доступен
          if (window.BroadcastChannel) {
            const channel = new BroadcastChannel('pixel_battle');
            channel.postMessage({ type: 'update', timestamp: Date.now() });
            setTimeout(() => channel.close(), 100);
          }
        } catch (e) {
          console.warn('Ошибка сохранения:', e);
        }
      }

      function loadCanvasFromStorage() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return false;
        
        const img = new Image();
        img.onload = () => {
          ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
          ctx.drawImage(img, 0, 0, CANVAS_SIZE, CANVAS_SIZE);
          imageData = ctx.getImageData(0, 0, CANVAS_SIZE, CANVAS_SIZE);
        };
        img.src = saved;
        return true;
      }

      // ===== МАСШТАБИРОВАНИЕ =====
      function applyTransform() {
        canvas.style.transform = `scale(${currentZoom})`;
      }

      function zoomIn() {
        zoomTarget = Math.min(zoomTarget * 1.5, 10);
        smoothZoom();
      }

      function zoomOut() {
        zoomTarget = Math.max(zoomTarget / 1.5, 0.5);
        smoothZoom();
      }

      function resetZoom() {
        zoomTarget = 1;
        smoothZoom();
      }

      function smoothZoom() {
        const animate = () => {
          currentZoom += (zoomTarget - currentZoom) * 0.3;
          if (Math.abs(zoomTarget - currentZoom) < 0.01) {
            currentZoom = zoomTarget;
          }
          applyTransform();
          
          if (Math.abs(currentZoom - zoomTarget) > 0.001) {
            requestAnimationFrame(animate);
          }
        };
        requestAnimationFrame(animate);
      }

      // ===== ПОЛУЧЕНИЕ КООРДИНАТ =====
      function getCanvasCoords(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = CANVAS_SIZE / rect.width;
        const scaleY = CANVAS_SIZE / rect.height;
        
        const offsetX = (clientX - rect.left) * scaleX;
        const offsetY = (clientY - rect.top) * scaleY;
        
        if (offsetX < 0 || offsetY < 0 || offsetX > CANVAS_SIZE || offsetY > CANVAS_SIZE) {
          return null;
        }
        
        return {
          x: Math.floor(Math.min(CANVAS_SIZE - 1, Math.max(0, offsetX))),
          y: Math.floor(Math.min(CANVAS_SIZE - 1, Math.max(0, offsetY)))
        };
      }

      // ===== ОБРАБОТКА РИСОВАНИЯ =====
      function handleDraw(clientX, clientY) {
        const coords = getCanvasCoords(clientX, clientY);
        if (!coords) return;
        
        coordDisplay.textContent = `X:${String(coords.x).padStart(4, ' ')} Y:${String(coords.y).padStart(4, ' ')}`;
        
        if (isDrawing) {
          if (setPixel(coords.x, coords.y, currentColor)) {
            // Сохраняем с задержкой для производительности
            clearTimeout(window._saveTimeout);
            window._saveTimeout = setTimeout(saveCanvasToStorage, 50);
            updatePlayerActivity();
          }
        }
      }

      // ===== ОБРАБОТЧИКИ СОБЫТИЙ =====
      
      // Touch события
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        
        if (e.touches.length === 1) {
          isDrawing = true;
          handleDraw(e.touches[0].clientX, e.touches[0].clientY);
        } else if (e.touches.length === 2) {
          isDrawing = false;
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          lastTouchDistance = Math.sqrt(dx * dx + dy * dy);
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        
        if (e.touches.length === 1 && isDrawing) {
          handleDraw(e.touches[0].clientX, e.touches[0].clientY);
        } else if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const distance = Math.sqrt(dx * dx + dy * dy);
          
          if (lastTouchDistance > 0) {
            const scale = distance / lastTouchDistance;
            zoomTarget = Math.min(Math.max(zoomTarget * scale, 0.5), 10);
            currentZoom = zoomTarget;
            applyTransform();
          }
          
          lastTouchDistance = distance;
        }
      }, { passive: false });

      canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        isDrawing = false;
        lastTouchDistance = 0;
      });

      // Mouse события
      canvas.addEventListener('mousedown', (e) => {
        e.preventDefault();
        isDrawing = true;
        handleDraw(e.clientX, e.clientY);
      });

      canvas.addEventListener('mousemove', (e) => {
        if (isDrawing) {
          handleDraw(e.clientX, e.clientY);
        } else {
          const coords = getCanvasCoords(e.clientX, e.clientY);
          if (coords) {
            coordDisplay.textContent = `X:${String(coords.x).padStart(4, ' ')} Y:${String(coords.y).padStart(4, ' ')}`;
          }
        }
      });

      canvas.addEventListener('mouseup', () => {
        isDrawing = false;
      });

      canvas.addEventListener('mouseleave', () => {
        isDrawing = false;
        coordDisplay.textContent = 'X: - Y: -';
      });

      // Колесо мыши
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.deltaY < 0) {
          zoomIn();
        } else {
          zoomOut();
        }
      }, { passive: false });

      // Контекстное меню
      canvas.addEventListener('contextmenu', e => e.preventDefault());

      // ===== УПРАВЛЕНИЕ ИГРОКАМИ =====
      function updatePlayerActivity() {
        localStorage.setItem(`pixel_player_${tabId}`, Date.now().toString());
      }

      function updatePlayerCount() {
        const now = Date.now();
        const keys = Object.keys(localStorage);
        let activePlayers = 0;
        
        keys.forEach(key => {
          if (key.startsWith('pixel_player_')) {
            const timestamp = parseInt(localStorage.getItem(key) || '0', 10);
            if (now - timestamp < 7000) {
              activePlayers++;
            } else {
              localStorage.removeItem(key);
            }
          }
        });
        
        playerCountSpan.textContent = Math.max(activePlayers, 1).toString();
      }

      // ===== СИНХРОНИЗАЦИЯ МЕЖДУ ВКЛАДКАМИ =====
      window.addEventListener('storage', (event) => {
        if (event.key === STORAGE_KEY && event.newValue) {
          loadCanvasFromStorage();
        }
        if (event.key && event.key.startsWith('pixel_player_')) {
          updatePlayerCount();
        }
      });

      // ===== ОБРАБОТЧИКИ UI =====
      colorPicker.addEventListener('input', (e) => {
        currentColor = e.target.value;
        colorPreview.style.backgroundColor = currentColor;
        colorPreview.style.boxShadow = `0 0 20px ${currentColor}cc, inset 0 1px 4px rgba(255,255,255,0.5)`;
      });

      zoomInBtn.addEventListener('click', zoomIn);
      zoomOutBtn.addEventListener('click', zoomOut);
      zoomResetBtn.addEventListener('click', resetZoom);

      // ===== ПЕРИОДИЧЕСКИЕ ОБНОВЛЕНИЯ =====
      setInterval(updatePlayerCount, 2000);
      
      // Синхронизация каждые 5 секунд
      setInterval(() => {
        const currentDataUrl = canvas.toDataURL('image/png');
        const storedDataUrl = localStorage.getItem(STORAGE_KEY);
        if (storedDataUrl && currentDataUrl !== storedDataUrl) {
          loadCanvasFromStorage();
        }
      }, 5000);

      // ===== ЗАПУСК =====
      function initialize() {
        colorPreview.style.backgroundColor = currentColor;
        colorPreview.style.boxShadow = `0 0 20px ${currentColor}cc, inset 0 1px 4px rgba(255,255,255,0.5)`;
        
        const loaded = loadCanvasFromStorage();
        if (!loaded) {
          initCanvas();
          saveCanvasToStorage();
        }
        
        updatePlayerActivity();
        updatePlayerCount();
        
        console.log('🎨 Pixel Battle запущен! Холст 2048x2048');
        console.log('📱 Масштабирование: жесты, колесико мыши, кнопки +/-');
        console.log('👥 Игроки онлайн:', playerCountSpan.textContent);
      }

      // Очистка при закрытии
      window.addEventListener('beforeunload', () => {
        localStorage.removeItem(`pixel_player_${tabId}`);
      });

      // Запускаем приложение
      initialize();

    })();
  </script>
</body>
</html>
